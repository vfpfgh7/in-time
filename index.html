<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>In Time.</title>

    <style type="text/css">
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #f5fbff;
        color: #34495e;
        font-family: Arial, sans-serif;
      }

      header {
        padding: 50px 20px 30px;
        text-align: center;
      }

      .main_text {
        max-width: 700px;
        margin: auto;
        padding: 35px;
        background: linear-gradient(135deg, #7ce1ff, #9edcff);
        color: white;
        border-radius: 25px;
        box-shadow: 0 10px 30px rgba(100, 190, 230, 0.25);
      }

      .main_text h1 {
        margin: 0;
        font-size: 3rem;
        font-weight: 700;
      }

      .main_text h2 {
        margin: 8px 0 0;
        font-size: 1.1rem;
        font-weight: 400;
        opacity: 0.9;
      }

      main {
        max-width: 700px;
        margin: 20px auto;
        padding: 0 20px;
      }

      #scheduler {
        padding: 30px;
        background: white;
        border-radius: 25px;
        box-shadow: 0 8px 25px rgba(70, 120, 150, 0.12);
      }

      #scheduler > h2 {
        margin-top: 0;
        color: #4b8eaa;
      }

      label {
        display: block;
        margin-top: 18px;
        margin-bottom: 6px;
        font-weight: 600;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border: 2px solid #d9eef7;
        border-radius: 12px;
        background: #fafdff;
        color: #34495e;
        font-size: 1rem;
        outline: none;
      }

      input:focus {
        border-color: #7ce1ff;
      }

      #scheduler button {
        width: 100%;
        margin-top: 25px;
        padding: 14px;
        border: none;
        border-radius: 14px;
        background: #7ce1ff;
        color: white;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s;
      }

      #scheduler button:hover {
        background: #62d4f5;
        transform: translateY(-1px);
      }

      #schedules {
        margin-top: 25px;
      }

      #schedules > h2 {
        color: #4b8eaa;
      }

      .schedule {
        margin-top: 15px;
        padding: 18px;
        background: #e9f9ff;
        border: 2px solid #bdefff;
        border-radius: 16px;
        box-shadow: 0 5px 15px rgba(70, 120, 150, 0.08);
      }

      .schedule.expired {
        background: #eeeeee;
        border-color: #d2d2d2;
        color: #777;
      }

      .schedule-name {
        margin-bottom: 6px;
        font-size: 1.15rem;
        font-weight: 700;
      }

      .schedule-time {
        margin-bottom: 12px;
      }

      .schedule-actions {
        display: flex;
        gap: 10px;
      }

      .schedule-actions button {
        width: auto;
        margin-top: 0;
        padding: 9px 15px;
        border: none;
        border-radius: 10px;
        color: white;
        font-size: 0.9rem;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s;
      }

      .edit-button {
        background: #55c878;
      }

      .edit-button:hover {
        background: #43b565;
        transform: translateY(-1px);
      }

      .delete-button {
        background: #ef6b6b;
      }

      .delete-button:hover {
        background: #df5151;
        transform: translateY(-1px);
      }

      footer {
        padding: 30px;
        text-align: center;
        color: #91a8b5;
      }
    </style>
  </head>

  <body>
    <header>
      <div class="main_text">
        <h1>In Time.</h1>
        <h2>A Scheduling App</h2>
      </div>
    </header>

    <main>
      <section id="scheduler">
        <h2>Create a Schedule</h2>

        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Schedule name">

        <label for="date">Date</label>
        <input type="date" id="date">

        <label for="start">Start</label>
        <input type="time" id="start">

        <label for="end">End</label>
        <input type="time" id="end">

        <button type="button">Add Schedule</button>
      </section>

      <section id="schedules">
        <h2>Your Schedules</h2>
      </section>
    </main>

    <footer>
      <p><strong>No copyright.</strong></p>
    </footer>
<script>
  const name = document.getElementById("name");
  const date = document.getElementById("date");
  const start = document.getElementById("start");
  const end = document.getElementById("end");
  const addSchedule = document.querySelector("#scheduler button");
  const schedulesContainer = document.getElementById("schedules");

  let schedules = JSON.parse(localStorage.getItem("schedules")) || [];

  schedules = schedules.filter(schedule => !isExpired(schedule));

  localStorage.setItem("schedules", JSON.stringify(schedules));

  findAvailableTime();

  addSchedule.addEventListener("click", () => {
    if (!name.value || !date.value || !start.value || !end.value) {
      alert("Please fill in all fields.");
      return;
    }

    if (start.value > end.value) {
      alert("End time must be after start time.");
      return;
    }

    const schedule = {
      name: name.value,
      date: date.value,
      start: start.value,
      end: end.value
    };

    schedules.push(schedule);

    findAvailableTime();

    name.value = "";
    date.value = "";
    start.value = "";
    end.value = "";
  });

  function displaySchedules() {
    schedulesContainer.innerHTML = "<h2>Your Schedules</h2>";

    schedules.forEach((schedule, index) => {
      const item = document.createElement("div");

      item.className = "schedule";

      item.innerHTML = `
        <div class="schedule-name">${schedule.name}</div>

        <div class="schedule-time">
          ${schedule.date}<br>
          ${schedule.start} - ${schedule.end}
        </div>

        <div class="schedule-actions">
          <button class="edit-button" type="button">Edit</button>
          <button class="delete-button" type="button">Delete</button>
        </div>
      `;

      item.querySelector(".edit-button").addEventListener("click", () => {
        editSchedule(index);
      });

      item.querySelector(".delete-button").addEventListener("click", () => {
        schedules.splice(index, 1);
        saveSchedules();
        displaySchedules();
      });

      schedulesContainer.appendChild(item);
    });
  }

  function editSchedule(index) {
    const schedule = schedules[index];

    name.value = schedule.name;
    date.value = schedule.date;
    start.value = schedule.start;
    end.value = schedule.end;

    schedules.splice(index, 1);

    saveSchedules();
    displaySchedules();
  }

  function isExpired(schedule) {
    const endDateTime = new Date(`${schedule.date}T${schedule.end}`);

    return endDateTime < new Date();
  }

  function saveSchedules() {
    localStorage.setItem("schedules", JSON.stringify(schedules));
  }

  function findAvailableTime() {
    const urgencyKeywords = {
      extreme: [
        "emergency",
        "urgent",
        "critical",
        "asap",
        "immediately",
        "now",
        "crisis",
        "deadline",
        "overdue",
        "last chance"
      ],

      high: [
        "today",
        "tonight",
        "tomorrow",
        "exam",
        "test",
        "interview",
        "presentation",
        "submission",
        "appointment",
        "flight",
        "departure",
        "funeral",
        "wedding",
        "court"
      ],

      medium: [
        "birthday",
        "anniversary",
        "launch",
        "release",
        "demo",
        "conference",
        "competition",
        "game",
        "performance",
        "meeting",
        "project",
        "assignment",
        "homework",
        "school",
        "work"
      ],

      low: [
        "event",
        "party",
        "practice",
        "training",
        "shopping",
        "errand",
        "coffee",
        "lunch",
        "dinner",
        "call",
        "chat",
        "visit",
        "hangout",
        "quick"
      ]
    };

    const priority = {
      extreme: 0,
      high: 1,
      medium: 2,
      low: 3
    };

    function getUrgency(name) {
      const text = name.toLowerCase();

      for (const level of ["extreme", "high", "medium", "low"]) {
        for (const keyword of urgencyKeywords[level]) {
          if (text.includes(keyword)) {
            return priority[level];
          }
        }
      }

      return 4;
    }

    schedules.sort((a, b) => {
      return getUrgency(a.name) - getUrgency(b.name);
    });

    saveSchedules();
    displaySchedules();
  }
</script>

  </body>
</html>
